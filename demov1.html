<title>Futuro Yo Aprende</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an infinite learning feed (center) with a sticky "what the AI knows about you" panel (right; a collapsible bar on phones). Aguayo stripe as the signature detail. */
:root {
  --bg: #F2F3F8;
  --surface: #FFFFFF;
  --chip: #E8EAF3;
  --ink: #181B35;
  --muted: #5A5F7E;
  --line: #DADDEA;
  --accent: #B8174F;
  --accent-soft: #FBE4EC;
  --on-accent: #FFFFFF;
  --money: #0B8459;
  --money-soft: #DCF2E8;
  --bad: #B42318;
  --bad-soft: #FCE5E2;
  --c-concepto: #2D4BA0;
  --c-ejemplo: #1F7A50;
  --c-analogia: #B4580C;
  --c-dato: #876600;
  --c-quiz: #5B3FA0;
  --ag1: #C21857; --ag2: #F28C28; --ag3: #1F8A5B; --ag4: #2D4BA0; --ag5: #F2C230;
  --font-display: "Unbounded", "Space Grotesk", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11132A; --surface: #1A1D38; --chip: #262A4B; --ink: #ECEEF8; --muted: #A2A7C6; --line: #2D3156;
    --accent: #F0548C; --accent-soft: #3B1730; --on-accent: #1B0A12;
    --money: #3CCB91; --money-soft: #12382B; --bad: #F2766B; --bad-soft: #3D1B19;
    --c-concepto: #8EA6F0; --c-ejemplo: #4FD39A; --c-analogia: #F5A25A; --c-dato: #F2C230; --c-quiz: #B9A4F2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11132A; --surface: #1A1D38; --chip: #262A4B; --ink: #ECEEF8; --muted: #A2A7C6; --line: #2D3156;
  --accent: #F0548C; --accent-soft: #3B1730; --on-accent: #1B0A12;
  --money: #3CCB91; --money-soft: #12382B; --bad: #F2766B; --bad-soft: #3D1B19;
  --c-concepto: #8EA6F0; --c-ejemplo: #4FD39A; --c-analogia: #F5A25A; --c-dato: #F2C230; --c-quiz: #B9A4F2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
p, h2, h3, ul, ol { margin: 0; }
button, input, textarea { font: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1060px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stripe { height: 10px; background: linear-gradient(180deg, var(--ag1) 0 2px, var(--ag2) 2px 4px, var(--ag5) 4px 6px, var(--ag3) 6px 8px, var(--ag4) 8px 10px); }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; padding-block: 14px 6px; }
.logo { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -0.02em; }
.logo em { font-style: normal; color: var(--accent); }
.ai { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.ai .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-analogia); }
.ai[data-state="ready"] .dot { background: var(--money); }
.ai[data-state="off"] .dot { background: var(--muted); }

.layout { display: grid; grid-template-columns: minmax(0, 620px) minmax(0, 340px); justify-content: center; gap: 28px; padding-block: 12px 40px; align-items: start; }
.feed-col { display: grid; gap: 14px; min-width: 0; }

/* start */
.start { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.q { font-family: var(--font-display); font-weight: 700; font-size: clamp(19px, 2.4vw, 23px); letter-spacing: -0.015em; line-height: 1.25; text-wrap: balance; }
.topic-row { display: flex; flex-wrap: wrap; gap: 10px; }
.topic-row input { flex: 1 1 240px; min-width: 0; font-size: 16.5px; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 11px; background: var(--bg); color: var(--ink); }
.topic-row input:focus { border-color: var(--accent); outline: none; }
.sugs { display: flex; flex-wrap: wrap; gap: 7px; }
.sug { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.sug:hover { border-color: var(--accent); color: var(--accent); }
.lbl { font-size: 13px; font-weight: 700; }
.lbl span { font-weight: 400; color: var(--muted); }
.start textarea { width: 100%; resize: vertical; min-height: 56px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); line-height: 1.45; }
.lvls { display: flex; flex-wrap: wrap; gap: 8px; border: 0; margin: 0; padding: 0; }
.lvls legend { font-size: 13px; font-weight: 700; margin-bottom: 6px; padding: 0; }
.lvls label { cursor: pointer; }
.lvls input { position: absolute; opacity: 0; pointer-events: none; }
.lvls span { display: inline-block; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); font-size: 13.5px; }
.lvls input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lvls input:focus-visible + span { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.btn { font-weight: 600; font-size: 15px; border-radius: 11px; padding: 11px 18px; cursor: pointer; border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.sm { padding: 6px 12px; font-size: 13.5px; border-radius: 9px; }
.topicbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.topicbar b { font-weight: 700; }
.preview-note { font-size: 13px; color: var(--muted); }

/* feed cards */
.feed { display: grid; gap: 14px; }
.fcard { position: relative; overflow: hidden; display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 12px; }
.gen-bar { position: absolute; left: 0; right: 0; top: 0; height: 4px; opacity: 0; transition: opacity .2s;
  background: repeating-linear-gradient(-45deg, var(--ag1) 0 10px, var(--ag2) 10px 20px, var(--ag3) 20px 30px, var(--ag4) 30px 40px); }
.generating > .gen-bar { opacity: 1; animation: slide 1.1s linear infinite; }
@keyframes slide { to { background-position: 113.14px 0; } }
.fc-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12.5px; }
.fc-type { font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 11.5px; color: var(--tc, var(--ink)); }
.fc-sub { color: var(--muted); }
.fc-sub::before { content: "·"; margin-right: 8px; color: var(--line); font-weight: 700; }
.fc-lv { display: inline-flex; gap: 3px; margin-left: auto; }
.fc-lv i { width: 7px; height: 7px; border-radius: 50%; background: var(--chip); }
.fc-lv i.on { background: var(--tc, var(--ink)); }
.fc-num { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.t-concepto { --tc: var(--c-concepto); }
.t-ejemplo { --tc: var(--c-ejemplo); }
.t-analogia { --tc: var(--c-analogia); }
.t-dato { --tc: var(--c-dato); }
.t-reto { --tc: var(--accent); }
.t-pregunta, .t-mito { --tc: var(--c-quiz); }
.t-perfil { --tc: var(--accent); background: var(--accent-soft); border-color: transparent; }
.fc-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(17px, 2vw, 19.5px); line-height: 1.28; letter-spacing: -0.01em; text-wrap: balance; }
.fc-text { font-size: 16px; line-height: 1.62; max-width: 62ch; }
.fc-obs { padding-left: 18px; display: grid; gap: 6px; font-size: 15.5px; line-height: 1.5; }
.fc-opts { display: grid; gap: 8px; }
.fc-opts:empty { display: none; }
.opt { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; font-size: 15px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 11px; padding: 10px 12px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--tc, var(--accent)); }
.opt:disabled { cursor: default; }
.opt .k { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--chip); font-family: var(--font-mono); font-size: 12px; display: grid; place-items: center; }
.opt.ok { border-color: var(--money); background: var(--money-soft); }
.opt.ko { border-color: var(--bad); background: var(--bad-soft); }
.opt.dim { opacity: .5; }
.fc-expl { font-size: 14.5px; padding: 10px 12px; border-radius: 10px; background: var(--chip); }
.fc-react { display: flex; flex-wrap: wrap; gap: 6px; }
.fc-react button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.fc-react button:hover:not(:disabled) { border-color: var(--accent); }
.fc-react button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fc-react button:disabled:not([aria-pressed="true"]) { opacity: .4; cursor: default; }
.fc-why { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; }
.fc-why span:first-child { font-weight: 700; color: var(--ink); }
.fc-foot { display: flex; align-items: center; gap: 10px; min-height: 16px; }
.fc-dwell { flex: 1; height: 3px; border-radius: 2px; background: var(--chip); overflow: hidden; }
.fc-dwell i { display: block; height: 100%; width: 0; background: var(--tc, var(--accent)); transition: width .25s linear; }
.fc-chip { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.fc-chip.skip { color: var(--bad); }
.fc-chip.long { color: var(--money); }
.typing::after { content: "▍"; color: var(--accent); margin-left: 2px; animation: blink 1s steps(1) infinite; font-style: normal; }
@keyframes blink { 50% { opacity: 0; } }
.placeholder { color: var(--muted); }
.feed-msg { display: grid; justify-items: center; gap: 10px; text-align: center; color: var(--muted); padding: 18px; border: 1.5px dashed var(--line); border-radius: 14px; font-size: 14px; }
#sentinel { height: 1px; }

/* panel */
.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); max-height: calc(100vh - 28px - env(safe-area-inset-top, 0px)); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
.panel-sum { display: none; }
.panel-body { display: grid; gap: 16px; padding: 18px; }
.panel h3 { font-family: var(--font-display); font-weight: 500; font-size: 14.5px; }
.sec { display: grid; gap: 8px; }
.label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.lvl-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1; }
.trend { font-family: var(--font-mono); font-size: 12px; }
.trend.up { color: var(--money); }
.trend.down { color: var(--bad); }
.track { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width .6s ease; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; font-size: 13.5px; }
.row .val { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .track { grid-column: 1 / -1; height: 5px; }
.row.top-fmt span:first-child { font-weight: 700; }
.row .tags { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tag.new { background: var(--money-soft); color: var(--money); }
.mini { font-size: 13px; color: var(--muted); }
.mini b { color: var(--ink); }
.plan { font-size: 13.5px; display: grid; gap: 4px; padding: 10px 12px; border-radius: 10px; background: var(--chip); }
.plan ul { padding-left: 16px; color: var(--muted); font-size: 12.5px; }
.log { list-style: none; padding: 0; display: grid; gap: 7px; font-size: 12.5px; line-height: 1.4; }
.log li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
.kd { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding-top: 1px; min-width: 52px; }
.kd-senal { color: var(--c-analogia); }
.kd-ia { color: var(--c-concepto); }
.kd-adapta { color: var(--money); }

@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .panel { order: -1; top: env(safe-area-inset-top, 0px); z-index: 5; max-height: none; overflow: visible; border-radius: 0 0 14px 14px; border-top: 0; }
  .panel-sum { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; background: transparent; border: 0; color: var(--ink); text-align: left; cursor: pointer; font-size: 13.5px; }
  .panel-sum b { font-family: var(--font-display); font-weight: 500; font-size: 12.5px; }
  .panel-sum .chev { font-family: var(--font-mono); color: var(--muted); }
  .panel-body { display: none; max-height: 62vh; overflow: auto; padding-top: 4px; }
  .panel.open .panel-body { display: grid; }
}
@media (prefers-reduced-motion: reduce) {
  .generating > .gen-bar, .typing::after { animation: none; }
  .track i, .fc-dwell i { transition: none; }
}
</style>

<div class="stripe" aria-hidden="true"></div>
<header class="wrap top">
  <span class="logo">Futuro Yo <em>Aprende</em></span>
  <span class="ai" id="ai" data-state="pending"><span class="dot"></span><span id="ai-text">IA en vivo: conectando…</span></span>
</header>

<main class="wrap layout">
  <section class="feed-col" aria-label="Tu feed">
    <form class="start" id="start">
      <label class="q" for="topic">¿Qué quieres aprender?</label>
      <div class="topic-row">
        <input id="topic" autocomplete="off" maxlength="120" value="Cómo proteger mis ahorros en Bolivia">
        <button class="btn" type="submit">Empezar en vivo</button>
      </div>
      <div class="sugs" id="sugs"></div>
      <label class="lbl" for="about">Sobre ti <span>(la IA lo usa para que los ejemplos sean de tu vida)</span></label>
      <textarea id="about" rows="2" maxlength="400">Tengo 21 años, estudio ingeniería en Cochabamba y vendo ropa por Instagram. Ahorro un poco en bolivianos.</textarea>
      <fieldset class="lvls">
        <legend>¿Cuánto sabes del tema?</legend>
        <label><input type="radio" name="lvl" value="cero"><span>Empiezo de cero</span></label>
        <label><input type="radio" name="lvl" value="algo" checked><span>Sé algo</span></label>
        <label><input type="radio" name="lvl" value="bastante"><span>Sé bastante</span></label>
      </fieldset>
    </form>
    <div class="topicbar" id="topicbar" hidden>
      <span>Tema: <b id="tb-topic"></b></span>
      <button class="btn ghost sm" type="button" id="tb-change">Cambiar tema</button>
    </div>
    <p class="preview-note" id="preview-note">Vista previa de tu feed. Toca «Empezar en vivo» y desde ahí cada tarjeta se escribe para ti mientras bajas.</p>
    <div class="feed" id="feed"></div>
    <div id="sentinel" aria-hidden="true"></div>
  </section>

  <aside class="panel" id="panel" aria-label="Lo que la IA sabe de ti">
    <button class="panel-sum" id="panel-sum" type="button" aria-expanded="false" aria-controls="panel-body">
      <span id="sum-text">Lo que la IA sabe de ti</span><span class="chev" id="sum-chev">ver</span>
    </button>
    <div class="panel-body" id="panel-body">
      <h3>Lo que la IA sabe de ti</h3>
      <div class="sec">
        <p class="label">Nivel estimado</p>
        <div class="lvl-row"><span class="big" id="m-level">2,2</span><span id="m-level-label" class="mini"></span><span class="trend" id="m-trend"></span></div>
        <div class="track"><i id="m-level-bar"></i></div>
      </div>
      <div class="sec">
        <p class="label">Cómo aprendes mejor</p>
        <div class="rows" id="m-formats"></div>
      </div>
      <div class="sec">
        <p class="label">Mapa del tema</p>
        <div class="rows" id="m-map"></div>
      </div>
      <div class="sec">
        <p class="mini" id="m-pace"></p>
        <p class="mini" id="m-quiz"></p>
      </div>
      <div class="sec">
        <p class="label" id="m-plan-label">Próxima tarjeta</p>
        <div class="plan" id="m-plan"></div>
      </div>
      <div class="sec">
        <p class="label">Señales recientes</p>
        <ol class="log" id="m-log"></ol>
      </div>
    </div>
  </aside>
</main>

<script>

  function sinceProfile() { let n = 0; for (let i = S.cards.length - 1; i >= 0; i--) { if (S.cards[i].type === "perfil") break; n++; } return n; }
  function avgRatio() { const r = S.ratios; return r.length ? r.reduce((a, b) => a + b, 0) / r.length : null; }

  const levelLabel = (v) => (v < 1.8 ? "Principiante" : v < 3.2 ? "Intermedio" : "Avanzado");

  function pickSub(reasons) {
    const recent = S.cards.slice(-2).map((c) => c.sub);
    let best = null;
    S.subs.forEach((s, i) => {
      const seen = seenCount(s);
      let score = 0.55 * s.interest + 0.45 * (1 - s.mastery) + (seen === 0 ? 0.25 : 0) - recent.filter((r) => r === s).length * 0.35 + Math.random() * 0.08;
      if (S.cards.length < 4) score -= i * 0.08;
      if (!best || score > best.score) best = { s, score };
    });
    const s = best.s;
    if (s.interest >= 0.6) reasons.push(`«${s.name}» te interesa`);
    else if (seenCount(s) === 0) reasons.push(`todavía no vimos «${s.name}»`);

    return s;
  }
  function planNext() {
    const reasons = [];
    const content = S.cards.filter((c) => c.type !== "perfil");
    if (content.length > 0 && sinceProfile() >= 6) {
      return { type: "perfil", sub: null, level: Math.round(S.level), reasons: ["ya viste 6 tarjetas y toca contarte lo que noto de ti"] };
    }
    let sub;
    if (S.forceSub) { sub = S.forceSub; reasons.push(`pediste más sobre «${sub.name}»`); S.forceSub = null; }
    else if (S.review) { sub = S.review; reasons.push(`fallaste o no entendiste «${sub.name}» y conviene repasarlo`); }
    else sub = pickSub(reasons);
    const lastContent = content[content.length - 1];
    let type;
    if (content.length === 0) { type = "concepto"; reasons.push("para empezar, lo básico"); }
    else if (S.confused || S.review) {
      type = aff("ejemplo") >= aff("analogia") ? "ejemplo" : "analogia";

      S.confused = false; S.review = null;

    else if (Math.random() < 0.22) {
      const pool = CONTENT_TYPES.filter((t) => t !== lastContent?.type);
      type = pool[Math.floor(Math.random() * pool.length)];

    } else {
      type = CONTENT_TYPES.filter((t) => t !== lastContent?.type).sort((a, b) => aff(b) - aff(a))[0];
      const st = S.typeStats[type];
      if (aff(type) > 0.3) reasons.push(st && st.n ? `te quedas más en los ${TYPES[type].pl} (${fmt1(st.dwell / st.n)} s en promedio)` : `los ${TYPES[type].pl} te funcionan mejor`);
    }
    if (S.levelNote) { reasons.push(S.levelNote); S.levelNote = null; }
    if (!reasons.length) reasons.push("sigue el orden de tu mapa del tema");
    return { type, sub, level: Math.round(clamp(S.level, 1, 5)), reasons };

  const normTag = (t) => t.toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  function parseTagged(text, tags) {
    const out = {};
    let cur = null;
    for (const raw of String(text).split("\n")) {
      const line = raw.replace(/\*\*/g, "").replace(/^\s*[-•]\s*/, "");
      const m = line.match(/^\s*([A-Za-zÁÉÍÓÚÑáéíóúñ_0-9]+)\s*[:：]\s*(.*)$/);
      if (m) {
        const tag = normTag(m[1]);
        if (tags.includes(tag)) { cur = tag; out[tag] = m[2].trim(); continue; }
      }
      if (cur && line.trim()) out[cur] = (out[cur] + " " + line.trim()).trim();
    }
    return out;
  }

  function renderPlan() {
    const p = S.lastPlan;
    const box = $("#m-plan");
    $("#m-plan-label").textContent = S.busy ? "La IA está escribiendo" : "Última decisión de la app";
    if (!p) { box.innerHTML = '<span class="mini">Cuando empieces, aquí verás por qué te toca cada tarjeta.</span>'; return; }
    box.innerHTML = `<span><b>${TYPES[p.type].label}</b>${p.sub ? ` · ${esc(p.sub.name)}` : ""}${p.type !== "perfil" ? ` · nivel ${p.level}` : ""}</span><ul>${p.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>`;
  }
  const KIND = { senal: "Señal", ia: "IA", adapta: "Adapta" };
  function renderLog() {
    $("#m-log").innerHTML = S.events.length ? S.events.map((e) => `<li><span class="kd kd-${e.kind}">${KIND[e.kind]}</span><span>${e.html}</span></li>`).join("") : '<li><span class="kd kd-adapta">Adapta</span><span>Todo lo que hagas en el feed aparece aquí.</span></li>';
  }
  el.sum.addEventListener("click", () => {
    const open = !el.panel.classList.contains("open");
    el.panel.classList.toggle("open", open);
    el.sum.setAttribute("aria-expanded", String(open));
    el.sumChev.textContent = open ? "cerrar" : "ver";
  });

  /* ---------- visibility & dwell ---------- */
  let ticker = 0;
  function tick() {
    const now = performance.now();
    let any = false;
    for (const c of S.cards) {
      if (!c.visibleSince) continue;
      any = true;
      const live = (c.dwell + now - c.visibleSince) / 1000;
      c.el.querySelector(".fc-dwell i").style.width = Math.min(100, (live / c.expected) * 100).toFixed(1) + "%";
      if (!c.classified) c.el.querySelector(".fc-chip").textContent = `leyendo · ${Math.floor(live)} s`;
    }
    if (!any && ticker) { clearInterval(ticker); ticker = 0; }
  }
  function ensureTicker() { if (!ticker && S.cards.some((c) => c.visibleSince)) ticker = setInterval(tick, 250); }
  const visIO = new IntersectionObserver((entries) => {
    const now = performance.now();
    for (const en of entries) {
      const card = S.byId.get(Number(en.target.dataset.id));
      if (!card || card.preview) continue;
      const enough = en.isIntersecting && en.intersectionRect.height >= 0.6 * Math.min(en.boundingClientRect.height, window.innerHeight);
      if (enough && !card.visibleSince && !document.hidden) {
        card.visibleSince = now;
        if (!card.seen) { card.seen = true; card.firstSeen = now; renderPanel(); maybeGenerate(); }
      } else if (!enough && card.visibleSince) {
        card.dwell += now - card.visibleSince;
        card.visibleSince = 0;
        classify(card);
      }
    }
    ensureTicker();
  }, { threshold: [0, 0.2, 0.4, 0.6, 0.8, 1] });
  document.addEventListener("visibilitychange", () => {
    const now = performance.now();
    for (const c of S.cards) {
      if (document.hidden && c.visibleSince) { c.dwell += now - c.visibleSince; c.visibleSince = 0; c.hiddenPause = true; }
      else if (!document.hidden && c.hiddenPause) { c.visibleSince = now; c.hiddenPause = false; }
    }
    ensureTicker();
  });
  function classify(card) {
    if (card.type === "perfil" || card.classified) return;
    const secs = card.dwell / 1000;
    if (secs < 0.5) return;
    card.classified = true;
    const ratio = secs / card.expected;
    const quiz = QUIZ_TYPES.includes(card.type);
    const chip = card.el.querySelector(".fc-chip");
    const st = (S.typeStats[card.type] ||= { n: 0, dwell: 0 });
    st.n++; st.dwell += secs;
    S.ratios.push(Math.min(ratio, 3));
    const s = card.sub;
    if (!quiz && ratio < 0.35 && !card.reactions.size) {
      S.aff[card.type] -= 0.6; s.interest = clamp(s.interest - 0.1);
      chip.textContent = `saltada · ${Math.round(secs)} s`; chip.className = "fc-chip skip";
      note(card, `la pasó rápido (${Math.round(secs)} s)`);
      logEvent("senal", `#${card.id} ${TYPES[card.type].label}: la pasaste rápido → menos ${TYPES[card.type].pl}`);
    } else if (ratio > 1.8) {
      S.aff[card.type] += 0.7; s.interest = clamp(s.interest + 0.15);
      chip.textContent = `te detuviste · ${Math.round(secs)} s`; chip.className = "fc-chip long";
      note(card, `se detuvo ${Math.round(secs)} s`);
      logEvent("senal", `#${card.id} ${TYPES[card.type].label}: te detuviste ${Math.round(secs)} s → «${esc(s.name)}» te interesa`);
    } else {
      S.aff[card.type] += 0.4; s.interest = clamp(s.interest + 0.05);
      chip.textContent = `${quiz ? "vista" : "leída"} · ${Math.round(secs)} s`; chip.className = "fc-chip";
      note(card, `la leyó (${Math.round(secs)} s)`);
    }
    renderPanel();
  }

  /* ---------- interactions ---------- */
  function refreshAhead(reason) {
    const stale = S.cards.filter((c) => !c.seen && !c.preview);
    let changed = stale.length > 0;
    for (const c of stale) {
      if (c.bankIdx != null) S.bankUsed.delete(c.bankIdx);
      visIO.unobserve(c.el);
      c.el.remove();
      S.cards.splice(S.cards.indexOf(c), 1);
      S.byId.delete(c.id);
      S.nextId = Math.min(S.nextId, c.id);
    }
    if (S.busy) { abortGen(); changed = true; }
    if (changed) logEvent("adapta", `Cambié la próxima tarjeta porque ${esc(reason)}.`);
    if (S.active && !S.busy && !S.paused) generateNext();
  }
  function onReact(card, r, btn) {
    if (!card || card.type === "perfil" || card.reactions.has(r)) return;
    card.reactions.add(r);
    btn.setAttribute("aria-pressed", "true");
    const s = card.sub;
    if (r === "facil" || r === "noentendi") {
      const other = card.el.querySelector(`.fc-react [data-r="${r === "facil" ? "noentendi" : "facil"}"]`);
      if (other) other.disabled = true;
    }
    if (r === "sirvio") {
      S.aff[card.type] += 1; s.interest = clamp(s.interest + 0.2);
      note(card, "marcó «Me sirvió»");
      logEvent("senal", `#${card.id}: «Me sirvió» → más ${TYPES[card.type].pl}`);
    } else if (r === "facil") {
      S.level = clamp(S.level + 0.5, 1, 5); s.mastery = clamp(s.mastery + 0.15);
      S.levelNote = "te pareció fácil, así que subí el nivel";
      note(card, "marcó «Muy fácil»");
      logEvent("senal", `#${card.id}: «Muy fácil» → nivel ${fmt1(S.level)}`);
      refreshAhead("te pareció fácil");
    } else if (r === "noentendi") {
      S.level = clamp(S.level - 0.4, 1, 5); s.mastery = clamp(s.mastery - 0.1);
      S.confused = true; S.review = s;
      note(card, "marcó «No entendí»");
      logEvent("senal", `#${card.id}: «No entendí» → bajo el nivel y lo explico distinto`);
      refreshAhead("marcaste «No entendí»");
    } else if (r === "mas") {
      s.interest = clamp(s.interest + 0.4); S.aff[card.type] += 0.5; S.forceSub = s;
      note(card, `pidió más sobre «${s.name}»`);
      logEvent("senal", `#${card.id}: «Más de esto» → sigo con «${esc(s.name)}»`);
      refreshAhead(`pediste más sobre «${s.name}»`);
    }
    renderPanel();
  }
  function onAnswer(card, i) {
    if (!card || card.answered || !card.options || card.preview) return;
    card.answered = true;
    const ok = i === card.correct;
    const secs = Math.max(1, Math.round((performance.now() - (card.firstSeen || performance.now())) / 1000));
    card.el.querySelectorAll(".opt").forEach((b, j) => {
      b.disabled = true;
      if (j === card.correct) b.classList.add("ok");
      else if (j === i) b.classList.add("ko");
      else b.classList.add("dim");
    });
    const ex = card.el.querySelector(".fc-expl");
    ex.textContent = (ok ? "Correcto. " : "No era esa. ") + (card.expl || "");
    ex.hidden = false;
    S.quiz.n++;
    const s = card.sub;
    if (ok) {
      S.quiz.ok++;
      S.level = clamp(S.level + (secs < 8 ? 0.35 : 0.25), 1, 5); s.mastery = clamp(s.mastery + 0.25);
      note(card, `respondió bien en ${secs} s`);
      logEvent("senal", `#${card.id}: correcta en ${secs} s → nivel ${fmt1(S.level)}`);
    } else {
      S.level = clamp(S.level - 0.3, 1, 5); s.mastery = clamp(s.mastery - 0.15); S.review = s;
      note(card, "respondió mal");
      logEvent("senal", `#${card.id}: incorrecta → repaso «${esc(s.name)}» con un ejemplo`);
      refreshAhead(`fallaste la pregunta sobre «${s.name}»`);
    }
    renderPanel();
  }
  el.feed.addEventListener("click", (e) => {
    const art = e.target.closest(".fcard");
    if (!art) return;
    const card = S.byId.get(Number(art.dataset.id));
    const rb = e.target.closest(".fc-react button");
    if (rb && !rb.disabled) { onReact(card, rb.dataset.r, rb); return; }
    const ob = e.target.closest(".opt");
    if (ob && !ob.disabled) onAnswer(card, Number(ob.dataset.i));
  });

  /* ---------- generation ---------- */
  function abortGen() {
    S.gen++;
    if (S.ctl) { try { S.ctl.abort(); } catch (e) { /* ignore */ } }
    S.ctl = null;
    S.busy = false;
    if (S.pendingCard) { S.pendingCard.el.remove(); S.nextId = Math.min(S.nextId, S.pendingCard.id); S.pendingCard = null; }
    renderPlan();
  }
  function unseenAhead() { return S.cards.filter((c) => !c.seen && !c.preview).length; }
  function maybeGenerate() {
    if (!S.active || S.busy || S.paused || !S.sentinelNear) return;
    if (S.cards.length >= S.cap) { showMsg(`Llegaste a ${S.cap} tarjetas en esta sesión.`, "Seguir 20 más", () => { S.cap += 20; generateNext(); }); S.paused = true; return; }
    if (unseenAhead() > 1) return;
    generateNext();
  }
  function addCard(card) {
    S.cards.push(card);
    S.byId.set(card.id, card);
    computeReading(card);
    visIO.observe(card.el);
  }
  function addSubIfNew(name) {
    const n = String(name || "").trim().replace(/[.«»"]/g, "");
    if (!n || /^no\b/i.test(n) || n.length > 40 || S.subs.length >= 10) return;
    if (S.subs.some((s) => s.name.toLowerCase() === n.toLowerCase())) return;
    S.subs.push({ name: n, mastery: 0.2, interest: 0.55, isNew: true });
    logEvent("adapta", `La IA detectó un subtema que te puede interesar: «${esc(n)}».`);
  }
  function showMsg(text, btnLabel, onClick) {
    const box = document.createElement("div");
    box.className = "feed-msg";
    box.innerHTML = `<p>${esc(text)}</p>${btnLabel ? `<button type="button" class="btn sm">${esc(btnLabel)}</button>` : ""}`;
    if (btnLabel) box.querySelector("button").addEventListener("click", () => { box.remove(); S.paused = false; onClick(); });
    el.feed.appendChild(box);
    return box;
  }

  async function generateNext() {
    if (!S.active || S.busy) return;
    const plan = planNext();
    S.lastPlan = plan;
    const token = ++S.gen;
    S.busy = true;
    const card = makeCard(plan);
    el.feed.appendChild(cardEl(card));
    card.el.classList.add("generating");
    renderPartial(card, {});
    S.pendingCard = card;
    renderPlan();
    const sample = await getSample();
    if (token !== S.gen) return;
    if (!sample) { S.busy = false; S.pendingCard = null; card.el.remove(); S.nextId = card.id; return bankNext(plan); }
    const ctl = (S.ctl = new AbortController());
    const isProfile = plan.type === "perfil";
    const t0 = performance.now();
    try {
      const { text } = await sample(isProfile ? profilePrompt() : cardPrompt(plan), {
        modelTier: "quick", cache: false, signal: ctl.signal,
        onText: ({ text }) => { if (token === S.gen) renderPartial(card, parseTagged(text, isProfile ? PROFILE_TAGS : CARD_TAGS)); }
      });
      if (token !== S.gen) return;
      S.busy = false; S.ctl = null; S.pendingCard = null;
      const ok = isProfile ? buildProfile(card, parseTagged(text, PROFILE_TAGS)) : buildCard(card, parseTagged(text, CARD_TAGS));
      if (!ok) {
        card.el.remove(); S.nextId = card.id;
        S.failStreak++;
        logEvent("ia", "La IA respondió en otro formato; escribo otra tarjeta.");
        if (S.failStreak < 2) generateNext(); else { S.paused = true; showMsg("No se pudo escribir la siguiente tarjeta.", "Intentar de nuevo", generateNext); }
        return;
      }
      S.failStreak = 0;
      renderFinal(card);
      addCard(card);
      const secs = fmt1((performance.now() - t0) / 1000);
      logEvent("ia", isProfile ? `Tarjeta #${card.id}: tu perfil, escrito en ${secs} s.` : `Tarjeta #${card.id} escrita en ${secs} s: ${TYPES[card.type].label}, «${esc(card.sub.name)}», nivel ${card.level}.`);
      renderPanel();
      maybeGenerate();
    } catch (e) {
      if (token !== S.gen) return;
      S.busy = false; S.ctl = null; S.pendingCard = null;
      card.el.remove(); S.nextId = card.id;
      renderPlan();
      if (markPermanent(e)) {
        logEvent("ia", "La IA en vivo no está permitida en esta vista.");
        if (S.bankMode || isDefault(S.topic)) { S.bankMode = true; generateNext(); }
        else showMsg("La generación en vivo funciona al abrir esta demo en claude.ai y permitir que use Claude.", null);
        return;
      }
      if (e && e.code === "cancelled") return;
      S.paused = true;
      showMsg(e && e.code === "rate_limited" ? "Demasiadas tarjetas seguidas. Espera unos segundos." : "No se pudo escribir la siguiente tarjeta.", "Seguir", generateNext);
    }
  }
  function buildCard(card, p) {
    if (!p.TITULO || !p.TEXTO) return false;
    card.title = p.TITULO; card.text = p.TEXTO;
    card.why = p.PORQUE || card.plan.reasons.join("; ");
    if (QUIZ_TYPES.includes(card.type)) {
      const opts = splitOpts(p.OPCIONES);
      const k = parseInt(String(p.CORRECTA || "").match(/\d/)?.[0] || "", 10);
      if (opts.length < 2 || !(k >= 1 && k <= opts.length)) return false;
      card.options = opts; card.correct = k - 1; card.expl = p.EXPLICACION || "";
    }
    if (p.SUBTEMA_NUEVO) addSubIfNew(p.SUBTEMA_NUEVO);
    return true;
  }
  function buildProfile(card, p) {
    const obs = ["OBS1", "OBS2", "OBS3"].map((k) => p[k]).filter(Boolean);
    if (obs.length < 2) { fillLocalProfile(card); return true; }
    card.title = p.TITULO || "Esto es lo que noto de ti";
    card.obs = obs; card.text = p.AHORA || "";
    return true;
  }
  function fillLocalProfile(card) {
    const ranked = ALL_TYPES.filter((t) => S.typeStats[t]?.n).sort((a, b) => aff(b) - aff(a));
    const best = ranked[0], worst = ranked[ranked.length - 1];
    const topSub = S.subs.slice().sort((a, b) => b.interest - a.interest)[0];
    const d = S.level - S.levelStart;
    card.title = "Esto es lo que noto de ti";
    card.obs = [
      best ? `Te quedas más en los ${TYPES[best].pl}: ${fmt1(S.typeStats[best].dwell / S.typeStats[best].n)} s en promedio.` : "Todavía estoy midiendo qué formato te funciona.",
      S.quiz.n ? `Respondiste bien ${S.quiz.ok} de ${S.quiz.n} preguntas; tu nivel ${d >= 0 ? "subió" : "bajó"} de ${fmt1(S.levelStart)} a ${fmt1(S.level)}.` : `Tu nivel estimado es ${fmt1(S.level)} de 5.`,
      topSub ? `Lo que más te interesa ahora: «${topSub.name}».` : "Aún no hay un subtema favorito."
    ];
    card.text = best && worst && best !== worst ? `más ${TYPES[best].pl} y menos ${TYPES[worst].pl}.` : "sigo probando formatos para conocerte mejor.";
  }
  function bankNext(plan) {
    S.bankMode = true;
    if (plan.type === "perfil") {
      const card = makeCard(plan);
      el.feed.appendChild(cardEl(card));
      fillLocalProfile(card);
      renderFinal(card); addCard(card); renderPanel(); maybeGenerate();
      return;
    }
    const free = BANK.map((b, i) => ({ b, i })).filter(({ i }) => !S.bankUsed.has(i));
    if (!free.length) { S.paused = true; showMsg("Sin IA en vivo, aquí terminan las tarjetas de ejemplo. Abre la demo en claude.ai para el feed infinito.", null); return; }
    const pick = free.find(({ b }) => b.type === plan.type && b.sub === plan.sub?.name) || free.find(({ b }) => b.type === plan.type) || free.find(({ b }) => b.sub === plan.sub?.name) || free[0];
    S.bankUsed.add(pick.i);
    const sub = S.subs.find((s) => s.name === pick.b.sub) || plan.sub;
    const card = makeCard({ ...plan, type: pick.b.type, sub });
    card.level = pick.b.level;
    card.bankIdx = pick.i;
    Object.assign(card, { title: pick.b.title, text: pick.b.text, why: pick.b.why + " (ejemplo sin IA)", options: pick.b.options || null, correct: pick.b.correct ?? -1, expl: pick.b.expl || "" });
    el.feed.appendChild(cardEl(card));
    renderFinal(card); addCard(card); renderPanel();
    logEvent("ia", `Tarjeta #${card.id}: ejemplo pre-escrito (sin IA en vivo).`);
    maybeGenerate();
  }

  /* ---------- start / topic ---------- */
  const isDefault = (t) => /ahorr/i.test(t) && /bolivia/i.test(t);
  async function startTopic(topic, about, lvl) {
    abortGen();
    for (const c of S.cards) visIO.unobserve(c.el);
    freshState();
    S.topic = topic; S.about = about; S.lvlChoice = lvl;
    S.level = S.levelStart = LEVEL_START[lvl] || 2.2;
    el.feed.innerHTML = "";
    el.note.hidden = true;
    el.start.hidden = true;
    el.topicbar.hidden = false;
    el.tbTopic.textContent = topic;
    renderPanel(); renderLog();
    const msg = showMsg("Analizando el tema y armando tu mapa…", null);
    const token = ++S.gen;
    const sample = await getSample();
    if (token !== S.gen) return;
    let names = null;
    if (sample) {
      try {
        const res = await sample.json(mapPrompt(), { modelTier: "quick" });
        if (token !== S.gen) return;
        const arr = Array.isArray(res) ? res : res && Array.isArray(res.subtemas) ? res.subtemas : null;
        if (arr) names = arr.map((x) => String(x).trim().slice(0, 40)).filter(Boolean).slice(0, 8);
        if (names && names.length < 3) names = null;
      } catch (e) {
        if (token !== S.gen) return;
        markPermanent(e);
      }
    }
    msg.remove();
    if (!names && (aiOff || !sample)) {
      if (!isDefault(topic)) {
        showMsg("La generación en vivo funciona al abrir esta demo en claude.ai y permitir que use Claude. Sin IA solo está disponible el tema de ejemplo.", "Usar el tema de ejemplo", () => {
          el.topic.value = DEFAULT_TOPIC; startTopic(DEFAULT_TOPIC, about, lvl);
        });
        return;
      }
      names = BANK_SUBS.slice();
      S.bankMode = true;
    }
    if (!names) names = GENERIC_SUBS.slice();
    const base = { cero: 0.1, algo: 0.25, bastante: 0.45 }[lvl] ?? 0.25;
    S.subs = names.map((n, i) => ({ name: n, mastery: clamp(base - i * 0.03, 0.05, 0.9), interest: 0.4, isNew: false }));
    logEvent("adapta", `Mapa del tema listo: ${S.subs.length} subtemas, de lo básico a lo avanzado.`);
    S.active = true;
    renderPanel();
    generateNext();
  }
  el.start.addEventListener("submit", (e) => {
    e.preventDefault();
    const topic = el.topic.value.trim();
    if (!topic) { el.topic.focus(); return; }
    const lvl = (document.querySelector('input[name="lvl"]:checked') || {}).value || "algo";
    startTopic(topic.slice(0, 120), el.about.value.trim().slice(0, 400), lvl);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("#tb-change").addEventListener("click", () => {
    abortGen();
    S.active = false;
    el.start.hidden = false;
    el.topicbar.hidden = true;
    el.topic.focus();
    el.topic.select();
  });
  $("#sugs").innerHTML = SUGGESTIONS.map((s) => `<button type="button" class="sug">${esc(s)}</button>`).join("");
  $("#sugs").addEventListener("click", (e) => { const b = e.target.closest(".sug"); if (b) { el.topic.value = b.textContent; el.topic.focus(); } });

  const sentIO = new IntersectionObserver(([en]) => { S.sentinelNear = en.isIntersecting; if (S.sentinelNear) maybeGenerate(); }, { rootMargin: "0px 0px 700px 0px" });
  sentIO.observe($("#sentinel"));

  /* ---------- preview at rest ---------- */
  function renderPreview() {
    S.subs = BANK_SUBS.map((n, i) => ({ name: n, mastery: clamp(0.25 - i * 0.03, 0.05, 0.9), interest: 0.4, isNew: false }));
    [1, 2].forEach((i) => {
      const b = BANK[i];
      const card = makeCard({ type: b.type, sub: S.subs.find((s) => s.name === b.sub), level: b.level, reasons: [] });
      card.preview = true;
      Object.assign(card, { title: b.title, text: b.text, why: b.why, options: b.options || null, correct: b.correct ?? -1 });
      el.feed.appendChild(cardEl(card));
      renderFinal(card);
    });
    S.subs = [];
    S.nextId = 1;
  }
  renderAi();
  renderPreview();
  renderPanel();
  renderLog();
})();
</script>
