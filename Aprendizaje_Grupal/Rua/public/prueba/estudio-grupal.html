<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio en grupo · prueba</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='22' cy='30' r='14' fill='%23FF6B4D'/><circle cx='42' cy='30' r='14' fill='%2322B888' opacity='.9'/><circle cx='32' cy='44' r='14' fill='%23FFCB3D' opacity='.9'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,500..700&display=swap">
<style>
/* Paleta y tipografía de Enséñale */
:root {
  --papel: #FBF7EF; --papel-2: #F3ECDF; --tinta: #23264A; --tinta-2: #565A7C; --tinta-3: #8D90A8; --linea: #E6DECF; --blanco: #fff;
  --coral: #FF6B4D; --coral-2: #E24E30; --sol: #FFCB3D; --sol-2: #E0A21A; --menta: #22B888; --menta-2: #16956C; --cielo: #4E9DFF; --uva: #8E70FF;
  --ambar-bg: #FFF4D6; --ambar-borde: #F3DC9C; --ambar-txt: #8A5A00;
  --r-s: 12px; --r-m: 18px; --r-l: 26px;
  --sombra-1: 0 1px 2px rgba(35, 38, 74, .06), 0 4px 14px rgba(35, 38, 74, .06);
  --sombra-2: 0 2px 4px rgba(35, 38, 74, .05), 0 14px 38px rgba(35, 38, 74, .11);
  --display: 'Fraunces', Georgia, serif; --texto: 'Atkinson Hyperlegible', system-ui, sans-serif; --mano: 'Caveat', 'Comic Sans MS', cursive;
  --barra: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font: 16px/1.5 var(--texto); color: var(--tinta); -webkit-font-smoothing: antialiased;
  background: var(--papel) radial-gradient(circle at 1px 1px, rgba(35, 38, 74, .075) 1px, transparent 0) 0 0 / 24px 24px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cielo); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; border: 0; border-radius: 999px; padding: .75em 1.35em; font-weight: 700; transition: transform .15s, box-shadow .15s, background .15s; white-space: nowrap; }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.98); }
.btn-pri { background: var(--tinta); color: #fff; box-shadow: 0 4px 0 #0E1030, 0 10px 24px rgba(35, 38, 74, .22); }
.btn-pri:hover:not(:disabled) { transform: translateY(-1px); }
.btn-coral { background: var(--coral); color: #fff; box-shadow: 0 4px 0 var(--coral-2); }
.btn-menta { background: var(--menta); color: #fff; box-shadow: 0 4px 0 var(--menta-2); }
.btn-sol { background: var(--sol); color: var(--tinta); box-shadow: 0 3px 0 var(--sol-2); }
.btn-sec { background: var(--blanco); border: 1.5px solid var(--linea); padding: .5em 1em; font-size: .88rem; box-shadow: var(--sombra-1); }
.btn-sec:hover:not(:disabled) { border-color: var(--tinta-3); }
.btn-sec.activo { background: var(--tinta); color: #fff; border-color: var(--tinta); }
.btn-txt { background: none; border: 0; padding: .3em .2em; font-weight: 700; color: var(--tinta-2); text-decoration: underline; text-decoration-color: var(--linea); text-underline-offset: 4px; text-decoration-thickness: 2px; }
.btn-txt:hover { color: var(--tinta); text-decoration-color: var(--coral); }
.btn-chico { padding: .35em .8em; font-size: .8rem; }

/* Barra */
.barra { position: sticky; top: 0; z-index: 30; height: var(--barra); display: flex; align-items: center; gap: 14px; padding: 0 22px; background: rgba(251, 247, 239, .88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--linea); }
.marca { display: flex; align-items: center; gap: 10px; font: 700 1.25rem/1 var(--display); letter-spacing: -.02em; white-space: nowrap; }
.marca b { color: var(--coral); }
a.marca { color: inherit; text-decoration: none; }
.marca .puntos3 { display: flex; }
.marca .puntos3 i { width: 16px; height: 16px; border-radius: 50%; margin-left: -5px; border: 2px solid var(--papel); }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--linea); background: var(--blanco); border-radius: 999px; padding: .38em .85em; font-size: .8rem; font-weight: 700; color: var(--tinta-2); white-space: nowrap; }
.chip i.led { width: 9px; height: 9px; border-radius: 50%; background: var(--tinta-3); }
.chip.ok i.led { background: var(--menta); box-shadow: 0 0 0 3px rgba(34, 184, 136, .2); }
.chip.aviso i.led { background: var(--sol); animation: latido 1s infinite; }
.chip.voz i.led { background: var(--coral); animation: latido 1s infinite; }
.chip code { font: 700 .86rem/1 ui-monospace, monospace; letter-spacing: .12em; color: var(--tinta); }
.barra-acc { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: nowrap; }
@keyframes latido { 50% { transform: scale(1.45); opacity: .6; } }
.kicker { display: inline-flex; align-items: center; gap: 8px; font: 700 .76rem/1 var(--texto); letter-spacing: .14em; text-transform: uppercase; color: var(--coral); margin: 0 0 12px; }
.kicker::before { content: ''; width: 22px; height: 3px; border-radius: 3px; background: currentColor; }
.et { margin: 0 0 4px; font: 700 .7rem/1 var(--texto); letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-3); }

/* Entrada (login y vestíbulo) */
.entrada { max-width: 1120px; margin: 0 auto; padding: 48px 28px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 44px; align-items: start; }
.entrada h1 { font: 700 clamp(2.2rem, 4vw, 3.4rem)/1.03 var(--display); letter-spacing: -.035em; margin: 0 0 14px; }
.entrada h1 em { font-style: italic; font-weight: 600; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--sol) 75%, transparent) 62% 92%, transparent 92%); }
.bajada { font-size: 1.08rem; color: var(--tinta-2); margin: 0 0 22px; max-width: 46ch; }
.lista-ideas { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.lista-ideas li { display: flex; gap: 12px; align-items: flex-start; color: var(--tinta-2); }
.lista-ideas b { color: var(--tinta); }
.lista-ideas .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .8rem; color: #fff; flex-shrink: 0; }
.form { background: var(--blanco); border-radius: var(--r-l); box-shadow: var(--sombra-2); padding: 26px; display: grid; gap: 18px; border: 1px solid rgba(230, 222, 207, .7); }
.form h2 { margin: 0; font: 700 1.35rem/1.1 var(--display); }
.campo { display: grid; gap: 6px; }
.campo label { font-weight: 700; font-size: .9rem; }
.in { width: 100%; border: 2px solid var(--linea); border-radius: var(--r-m); padding: .7em .95em; background: var(--papel); transition: border-color .15s, background .15s; }
.in:focus { outline: 0; border-color: var(--tinta); background: #fff; }
.in-codigo { font: 700 1.5rem/1 ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; text-align: center; }
.seg { display: inline-flex; background: var(--papel-2); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: .5em 1em; font-weight: 700; font-size: .88rem; color: var(--tinta-2); }
.seg button[aria-pressed="true"] { background: var(--blanco); color: var(--tinta); box-shadow: var(--sombra-1); }
.fila { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.separador { display: flex; align-items: center; gap: 12px; color: var(--tinta-3); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
.separador::before, .separador::after { content: ''; flex: 1; height: 1px; background: var(--linea); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; color: var(--tinta-2); }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--menta); }
.error-txt { color: var(--coral-2); font-weight: 700; margin: 0; font-size: .9rem; }
.nota { margin: 0; font-size: .84rem; color: var(--tinta-2); background: var(--ambar-bg); border: 1px solid var(--ambar-borde); border-radius: var(--r-s); padding: 10px 12px; }
.nota code { background: rgba(0, 0, 0, .05); padding: 1px 5px; border-radius: 5px; font-size: .8rem; }

/* Sala */
.sala { max-width: 1440px; margin: 0 auto; padding: 18px 22px 28px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.escenario { display: grid; gap: 14px; min-width: 0; }
.titulo-clase { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.titulo-clase h1 { margin: 0; font: 700 1.6rem/1.1 var(--display); letter-spacing: -.02em; }
.titulo-clase p { margin: 2px 0 0; color: var(--tinta-2); font-size: .9rem; }

/* Reproductor */
.reproductor { position: relative; background: #0E1030; border-radius: var(--r-l); overflow: hidden; box-shadow: var(--sombra-2); aspect-ratio: 16 / 9; isolation: isolate; }
.reproductor video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0E1030; transition: filter .4s; }
.reproductor.atenuado video { filter: brightness(.55) saturate(.8); }
.reproductor .clic { position: absolute; inset: 0; z-index: 1; }
.capa { position: absolute; z-index: 5; }

/* Avatares de integrantes */
.av { --c: var(--cielo); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; font: 700 .78rem/1 var(--texto); letter-spacing: .02em; border: 2.5px solid #fff; flex-shrink: 0; position: relative; box-shadow: var(--sombra-1); overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.habla { box-shadow: 0 0 0 3px var(--coral), 0 0 0 7px rgba(255, 107, 77, .25); animation: anillo 1.1s ease-in-out infinite; }
@keyframes anillo { 50% { box-shadow: 0 0 0 3px var(--coral), 0 0 0 11px rgba(255, 107, 77, 0); } }
.av.desfasado { box-shadow: 0 0 0 3px var(--sol); }
.av.chico { width: 24px; height: 24px; font-size: .6rem; border-width: 2px; }

/* Avatares arriba del video (co-presencia) */
.presentes { top: 14px; left: 14px; display: flex; gap: 6px; align-items: center; }
.presentes .av { width: 36px; height: 36px; }
.estado-sala { top: 14px; right: 14px; display: flex; gap: 8px; }
.estado-sala .chip { background: rgba(255, 255, 255, .92); border-color: transparent; }

/* Aviso ámbar de desfase (reglas 6 a 8) */
.aviso-desfase { left: 50%; top: 64px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; background: var(--ambar-bg); border: 1.5px solid var(--ambar-borde); border-radius: 999px; padding: 6px 8px 6px 8px; box-shadow: var(--sombra-2); animation: entra .4s cubic-bezier(.3, 1.4, .5, 1) both; max-width: calc(100% - 28px); }
.aviso-desfase .txt { font-size: .88rem; color: var(--ambar-txt); line-height: 1.2; }
.aviso-desfase .txt b { color: var(--tinta); display: block; font-size: .92rem; }
@keyframes entra { from { opacity: 0; transform: translate(-50%, -8px) scale(.97); } }

/* Voz y auto-pausa (reglas 13 a 15) */
.voz-capa { inset: 0; display: grid; place-items: center; pointer-events: none; }
.voz-tarjeta { pointer-events: auto; background: #fff; border-radius: var(--r-l); padding: 18px 22px; display: grid; justify-items: center; gap: 10px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); min-width: 300px; text-align: center; animation: sube .4s cubic-bezier(.3, 1.4, .5, 1) both; }
@keyframes sube { from { transform: translateY(20px) scale(.96); opacity: 0; } }
.voz-tarjeta .av { width: 64px; height: 64px; font-size: 1.2rem; border-width: 3px; }
.voz-tarjeta h3 { margin: 0; font: 700 1.2rem/1.2 var(--display); }
.voz-tarjeta p { margin: 0; color: var(--tinta-2); font-size: .86rem; }
.ondas { display: flex; gap: 4px; align-items: center; height: 26px; }
.ondas i { width: 5px; border-radius: 4px; background: var(--coral); animation: onda .9s ease-in-out infinite; }
.ondas i:nth-child(2) { animation-delay: .1s; } .ondas i:nth-child(3) { animation-delay: .2s; } .ondas i:nth-child(4) { animation-delay: .3s; } .ondas i:nth-child(5) { animation-delay: .4s; }
@keyframes onda { 0%, 100% { height: 6px; } 50% { height: 26px; } }
.cuenta { font: 800 3.2rem/1 var(--display); color: var(--menta); animation: late 1s ease-in-out infinite; }
@keyframes late { 0% { transform: scale(1.25); opacity: .4; } 30% { transform: scale(1); opacity: 1; } }

/* Tarjeta de la pregunta (reglas 17 a 23): compacta, flotando sobre el video */
.control-capa { z-index: 7; inset: 0; display: grid; place-items: end center; padding: 16px 16px 104px; background: linear-gradient(transparent 35%, rgba(14, 16, 48, .45)); }
.control { width: min(420px, 100%); max-height: 100%; overflow: auto; background: rgba(255, 255, 255, .97); border-radius: 18px; box-shadow: 0 18px 50px rgba(14, 16, 48, .32); padding: 14px 16px 12px; display: grid; gap: 10px; animation: entra-pregunta .3s cubic-bezier(.3, 1.3, .5, 1); scrollbar-width: thin; }
@keyframes entra-pregunta { from { transform: translateY(12px) scale(.98); } }
.control-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.fase { font: 700 .66rem/1 var(--texto); letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-3); }
.fase.debate { color: var(--coral-2); }
.fase.cerrada { color: var(--menta-2); }
.reloj { font: 700 .78rem/1 ui-monospace, monospace; color: var(--tinta-2); background: var(--papel-2); border-radius: 999px; padding: 4px 8px; }
.reloj.debate { color: var(--coral-2); background: #FFEDE8; }
.control h2 { margin: 0; font: 700 1.02rem/1.3 var(--display); letter-spacing: -.005em; }
.opciones { display: grid; gap: 6px; }
.opcion { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; text-align: left; border: 1.5px solid var(--linea); background: #fff; border-radius: 12px; padding: 7px 10px; font-size: .86rem; line-height: 1.3; transition: border-color .15s, background .15s; position: relative; overflow: hidden; }
.opcion:hover:not(:disabled) { border-color: var(--tinta-3); background: var(--papel); }
.opcion:disabled { opacity: 1; }
.opcion .letra { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--papel-2); font-weight: 700; font-size: .7rem; color: var(--tinta-2); }
.opcion .txt { font-weight: 600; }
.opcion .quien { display: flex; }
.opcion .quien .av { margin-left: -6px; width: 20px; height: 20px; font-size: .5rem; border-width: 1.5px; }
.opcion .barrita { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--cielo); opacity: .6; transition: width .5s; }
.opcion.mia { border-color: var(--tinta); }
.opcion.mia .letra { background: var(--tinta); color: #fff; }
.opcion.correcta { border-color: var(--menta); background: #F2FBF7; }
.opcion.correcta .letra { background: var(--menta); color: #fff; }
.opcion.incorrecta.mia { border-color: #F3B4A6; background: #FFF6F3; }
.opcion.incorrecta.mia .letra { background: var(--coral); color: #fff; }
.control-pie { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .76rem; color: var(--tinta-3); }
.votantes { display: flex; align-items: center; gap: 6px; }
.votantes .av { margin-left: -5px; width: 18px; height: 18px; font-size: .45rem; border-width: 1.5px; }
.votantes .av.no { opacity: .3; filter: grayscale(1); }
.explicacion { margin: 0; font-size: .82rem; line-height: 1.45; color: var(--tinta-2); border-left: 2px solid var(--menta); padding: 2px 0 2px 10px; }
.explicacion b { color: var(--tinta); }
.btn-continuar { border: 0; background: var(--tinta); color: #fff; border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: .76rem; }

/* Controles del reproductor */
.controles { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 34px 18px 12px; background: linear-gradient(transparent, rgba(14, 16, 48, .85)); color: #fff; display: grid; gap: 8px; }
.linea-tiempo { position: relative; height: 46px; cursor: pointer; }
.pista { position: absolute; left: 0; right: 0; bottom: 10px; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .25); }
.pista .avance { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--coral); }
.zona { position: absolute; bottom: 7px; height: 12px; border-radius: 4px; background: repeating-linear-gradient(-45deg, rgba(255, 203, 61, .95) 0 5px, rgba(255, 203, 61, .6) 5px 10px); box-shadow: 0 0 0 1.5px rgba(255, 203, 61, .9); }
.zona.leve { background: rgba(255, 203, 61, .35); box-shadow: none; }
.zona-et { position: absolute; bottom: 26px; transform: translateX(-50%); white-space: nowrap; font: 700 .66rem/1 var(--texto); letter-spacing: .06em; background: var(--sol); color: var(--tinta); padding: 4px 7px; border-radius: 6px; pointer-events: none; }
.zona-et::after { content: ''; position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; background: var(--sol); transform: translateX(-50%) rotate(45deg); }
.marca-cp { position: absolute; bottom: 7px; width: 12px; height: 12px; transform: translateX(-50%) rotate(45deg); background: #fff; border: 2.5px solid var(--uva); border-radius: 3px; }
.marca-cp.cerrada { background: var(--menta); border-color: #fff; }
.marca-cp.debate { background: var(--coral); border-color: #fff; }
.punto-yo { position: absolute; bottom: 6px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transform: translateX(-50%); box-shadow: 0 0 0 4px rgba(255, 255, 255, .25), 0 2px 6px rgba(0, 0, 0, .4); z-index: 3; }
.punto-amigo { position: absolute; bottom: 22px; transform: translateX(-50%); transition: left .9s linear; z-index: 2; }
.punto-amigo .av { width: 22px; height: 22px; font-size: .55rem; border-width: 2px; }
.punto-amigo::after { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: 6px; background: #fff; transform: translateX(-50%); opacity: .8; }
.barra-ctrl { display: flex; align-items: center; gap: 12px; }
.b-ctrl { width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); color: #fff; display: grid; place-items: center; padding: 0; }
.b-ctrl:hover:not(:disabled) { background: rgba(255, 255, 255, .26); }
.b-ctrl svg { width: 18px; height: 18px; }
.btn-sec svg, .chip svg, .b-cuaderno svg { width: 16px; height: 16px; flex-shrink: 0; vertical-align: -3px; }
.b-ctrl.grande { width: 44px; height: 44px; background: #fff; color: var(--tinta); }
.tiempo { font: 700 .86rem/1 ui-monospace, monospace; opacity: .9; }
.espacio { flex: 1; }
.vol { width: 90px; accent-color: #fff; }
.b-vel { border: 1.5px solid rgba(255, 255, 255, .4); background: none; color: #fff; border-radius: 8px; padding: 3px 8px; font-weight: 700; font-size: .78rem; }
.b-cuaderno { border: 0; background: #fff; color: var(--tinta); border-radius: 999px; padding: .45em 1em; font-weight: 700; font-size: .84rem; display: inline-flex; gap: 6px; align-items: center; }
.b-cuaderno.activo { background: var(--sol); }

/* Aviso de sesión */
.aviso-sesion { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: var(--blanco); border: 1.5px dashed var(--linea); border-radius: var(--r-m); padding: 12px 16px; font-size: .92rem; color: var(--tinta-2); }
.aviso-sesion b { color: var(--tinta); }

/* Panel lateral */
.lado { display: grid; gap: 16px; position: sticky; top: calc(var(--barra) + 18px); max-height: calc(100dvh - var(--barra) - 36px); overflow-y: auto; scrollbar-width: thin; padding: 2px; }
.tarjeta { background: var(--blanco); border-radius: var(--r-l); box-shadow: var(--sombra-2); border: 1px solid rgba(230, 222, 207, .7); padding: 18px; display: grid; gap: 12px; }
.tarjeta-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tarjeta h3 { margin: 0; font: 700 1.1rem/1.2 var(--display); }
.sinc { font: 700 .82rem/1 var(--texto); color: var(--menta-2); background: #DDF6EC; border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
.sinc.parcial { color: var(--ambar-txt); background: var(--ambar-bg); }
.integrantes { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.integrante { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: var(--r-m); transition: background .2s; }
.integrante.yo { background: var(--papel); }
.integrante .nombre { font-weight: 700; font-size: .94rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.2; }
.integrante .sub { font-size: .78rem; color: var(--tinta-3); }
.integrante .sub.amb { color: var(--ambar-txt); font-weight: 700; }

/* ============ Reglas puras (copia de lib/grupo/*.ts) ============ */
const UMBRAL_DESFASE_S = 30;
const mediana = v => { if (!v.length) return null; const s = [...v].sort((a, b) => a - b), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function calcularSincronia(lista) {
  const r = lista.map(yo => {
    const med = mediana(lista.filter(o => o.userId !== yo.userId).map(o => o.posicion));
    const dif = med === null ? 0 : yo.posicion - med;
    return { userId: yo.userId, posicion: yo.posicion, medianaResto: med, diferencia: dif, desfasado: Math.abs(dif) > UMBRAL_DESFASE_S };
  });
  return { integrantes: r, sincronizados: r.filter(x => !x.desfasado).length, total: r.length };
}
function causaDesfase(e) {
  if (e.pausaPorVoz || e.estado === 'hablando') return 'conversando';
  if (e.cuadernoActivo || e.estado === 'escribiendo') return 'tomando notas';
  if (e.retrocedio) return 'repasando';
  if (e.estado === 'pausado') return 'en pausa';
  return null;
}
const VOLUMEN_HABLANDO = .15, SILENCIO_MS = 3000, CUENTA_MS = 3000;
function reducirVoz(s, ev) {
  switch (ev.tipo) {
    case 'reanudar_manual': case 'pausa_manual': return { modo: 'normal' };
    case 'mantener_pausa': return s.modo === 'pausa_voz' || s.modo === 'cuenta_regresiva' ? { modo: 'pausa_mantenida' } : s;
    case 'oradores':
      if (s.modo === 'pausa_mantenida') return s;
      if (ev.hablando) return s.modo === 'normal' && !ev.reproduciendo ? s : { modo: 'pausa_voz', silencioDesde: null };
      if (s.modo === 'pausa_voz' && s.silencioDesde === null) return { modo: 'pausa_voz', silencioDesde: ev.ahora };
      return s;
    case 'tick':
      if (s.modo === 'pausa_voz' && s.silencioDesde !== null && ev.ahora - s.silencioDesde >= SILENCIO_MS) return { modo: 'cuenta_regresiva', inicio: ev.ahora };
      if (s.modo === 'cuenta_regresiva' && ev.ahora - s.inicio >= CUENTA_MS) return { modo: 'normal' };
      return s;
  }
  return s;
}
function efectosVoz(s, ahora) {
  if (s.modo === 'normal') return { pausado: false, volumen: 1, cuenta: null };
  if (s.modo === 'cuenta_regresiva') return { pausado: true, volumen: VOLUMEN_HABLANDO, cuenta: Math.max(1, Math.ceil((CUENTA_MS - (ahora - s.inicio)) / 1000)) };
  return { pausado: true, volumen: VOLUMEN_HABLANDO, cuenta: null };
}

/* ---------- Reproductor: el video se mueve solo por mí (regla 5) ---------- */
const videoEl = () => $('#video');
function aplicarReproduccion() {
  const v = videoEl(); if (!v) return;
  if (R.motivos.size) { if (!v.paused) v.pause(); }
  else if (v.paused) v.play().catch(() => { R.motivos.add('manual'); pintarPlay(); });
}
function alternarPlay() {
  const v = videoEl(); if (!v) return;
  if (R.control) { aviso('Primero responde la pregunta'); return; }
  if (R.fant.sonando) { terminarDiscusion(); return; }
  if (R.motivos.size) {
    // Reanudar a mano cancela la espera (regla 8) y la pausa por voz (regla 15).
    R.motivos.clear(); R.esperandoA = null;
    R.voz.estado = reducirVoz(R.voz.estado, { tipo: 'reanudar_manual' });
  } else {
    R.motivos.add('manual');
    R.voz.estado = reducirVoz(R.voz.estado, { tipo: 'pausa_manual' });
  }
  aplicarReproduccion(); pintarDinamico();
}
function pintarPlay() {
  const b = $('#bPlay'), v = videoEl(); if (!b || !v) return;
  poner(b, ico(v.paused ? 'play' : 'pausa')); b.setAttribute('aria-label', v.paused ? 'Reproducir' : 'Pausar');
}
function saltar(d) { const v = videoEl(); v.currentTime = Math.max(0, Math.min(v.duration || R.datos.video.duracion, v.currentTime + d)); }
function cambiarVelocidad() {
  const vel = [1, 1.25, 1.5, 2, .75]; R.velocidad = vel[(vel.indexOf(R.velocidad) + 1) % vel.length];
  videoEl().playbackRate = R.velocidad; $('#bVel').textContent = R.velocidad + 'x';
}
function aplicarVolumen() { const v = videoEl(); if (v) v.volume = Math.max(0, Math.min(1, R.volumen * R.factorVoz)); }
function duracion() { const v = videoEl(); return (v && isFinite(v.duration) && v.duration) || R.datos.video.duracion; }
function buscarEnLinea(e) {
  if (R.control) return;
  const r = e.currentTarget.getBoundingClientRect();
  videoEl().currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * duracion();
}
function alAvanzar() {
  const v = videoEl(); if (!v || !R) return;
  const t = v.currentTime;
  // Regla 18: al llegar al minuto de una pregunta se pausa mi video y se abre. Se usa una ventana
  // de 1,5 s después del minuto (no el cruce exacto), así no se pierde si el video se traba.
  if (!R.buscando && sesionActiva() && !R.control && !v.paused) {
    const cp = R.datos.checkpoints.find(c => !R.vistos.has(c.id) && t >= c.segundo && t - c.segundo < 1.5);
    if (cp) abrirControl(cp.id);
  }
  if (!R.buscando) { revisarFantasmas(R.ultimaPos, t); R.ultimaPos = t; }
  if (sesionActiva()) precargarPreguntas(t);
  // Regla 8: la espera termina cuando la otra persona me alcanza.
  if (R.esperandoA) {
    const otro = R.presencia.get(R.esperandoA);
    if (!otro) { R.esperandoA = null; R.motivos.delete('espera'); aplicarReproduccion(); }
  }
  $('#tiempo').textContent = `${mmss(t)} / ${mmss(duracion())}`;
  pintarCursorLinea();
}
async function alBuscar() {
  const v = videoEl(); if (!v || !R) return;
  const desde = R.ultimaPos, hasta = v.currentTime;
  R.buscando = false; R.ultimaPos = hasta;
  pintarCursorLinea();
  // Regla 10: un retroceso es un salto atrás de 5 s o más.
  if (desde - hasta >= 5) {
    R.retrocedioHasta = Date.now() + 8000;
    if (sesionActiva()) {
      try { await api(`/grupo/salas/${R.codigo}/friccion`, { method: 'POST', body: { desde, hasta } }); }
      catch (x) { if (x.codigo !== 'SIN_SESION') console.warn(x); }
    }
  }
}

/* ---------- Presence (posición una vez por segundo) ---------- */
function miEstado() {
  const v = videoEl();
  const hablando = R.voz.oradores.includes(yo.id);
  return {
    userId: yo.id, nombre: yo.nombre, avatar: yo.avatar,
    posicion: v ? +v.currentTime.toFixed(1) : 0,
    estado: hablando ? 'hablando' : R.escribiendo ? 'escribiendo' : (!v || v.paused) ? 'pausado' : 'viendo',
    cuadernoActivo: R.cuaderno,
    pausaPorVoz: R.motivos.has('voz'),
    retrocedio: Date.now() < R.retrocedioHasta,
    esperandoA: R.esperandoA,
    editando: R.nb?.editando || null,
    enviadoEn: Date.now()
  };
}
// Presence solo marca quién está conectado (un track al entrar): Supabase cierra el canal si
// se llama a track cada segundo. La posición y el estado van por Broadcast ("estado").
function publicarPresencia() {
  if (!R?.canal || R.canal.state !== 'joined') return;
  const e = miEstado(); R.estados.set(yo.id, e); recomponerPresencia(); muestraRecorrido(e);
  R.canal.send({ type: 'broadcast', event: 'estado', payload: e }).catch(() => {});
}
function recomponerPresencia() {
  const m = new Map();
  for (const id of R.conectados) {
    const e = R.estados.get(id);
    if (e) m.set(id, e);
    else { const i = R.datos.integrantes.find(x => x.userId === id); m.set(id, { userId: id, nombre: i?.nombre || 'Integrante', avatar: i?.avatar || null, posicion: 0, estado: 'pausado', cuadernoActivo: false, pausaPorVoz: false, retrocedio: false, esperandoA: null, editando: null, enviadoEn: 0 }); }
  }
  m.set(yo.id, R.estados.get(yo.id) || miEstado());
  R.presencia = m;
}
function conectarRealtime() {
  const canal = sb.channel(R.datos.canal, { config: { presence: { key: yo.id }, broadcast: { self: true } } });
  R.canal = canal;
  canal.on('presence', { event: 'sync' }, () => {
    if (!R) return;
    R.conectados = new Set(Object.keys(canal.presenceState()));
    R.conectados.add(yo.id);
    for (const id of R.estados.keys()) if (!R.conectados.has(id)) R.estados.delete(id);
    recomponerPresencia();
    vigilarAnfitrion();
  });
  canal.on('broadcast', { event: '*' }, ({ event, payload }) => alEvento(event, payload));
  canal.subscribe(st => {
    if (st !== 'SUBSCRIBED' || !R) return;
    canal.track({ userId: yo.id, nombre: yo.nombre, avatar: yo.avatar }).catch(() => {});
    publicarPresencia();
  });
}
// Regla 4: si el anfitrión desaparece de Presence más de 5 s, quien lleva más tiempo pide el cambio.
function vigilarAnfitrion() {
  const host = R.datos.sala.anfitrion;
  if (R.presencia.has(host)) { R.anfitrionAusenteDesde = null; return; }
  R.anfitrionAusenteDesde ??= Date.now();
  if (Date.now() - R.anfitrionAusenteDesde < 5000) return;
  const conectados = [...R.presencia.keys()];
  const masAntiguo = R.datos.integrantes.filter(i => conectados.includes(i.userId)).sort((a, b) => new Date(a.unidoEn) - new Date(b.unidoEn))[0];
  if (masAntiguo?.userId !== yo.id) return;
  R.anfitrionAusenteDesde = Date.now() + 30000; // no reintentar enseguida
  api(`/grupo/salas/${R.codigo}/anfitrion`, { method: 'POST', body: { conectados } }).catch(x => console.warn(x));
}

/* ---------- Eventos del servidor (Broadcast) ---------- */
function alEvento(evento, p) {
  if (!R) return;
  switch (evento) {
    case 'estado':
      if (p.userId === yo.id) break;
      R.estados.set(p.userId, p);
      if (R.conectados.has(p.userId)) recomponerPresencia();
      break;
    case 'integrante_entro': if (p.userId !== yo.id) aviso(`${primerNombre(p.nombre)} entró a la sala`); recargarSala(); break;
    case 'integrante_salio': if (p.userId !== yo.id) aviso(`${primerNombre(integrante(p.userId).nombre)} salió de la sala`); recargarSala(); break;
    case 'anfitrion_cambio': aviso(p.anfitrion === yo.id ? 'Ahora eres el anfitrión' : `${primerNombre(integrante(p.anfitrion).nombre)} es el nuevo anfitrión`); recargarSala(); break;
    case 'sesion_iniciada': R.vistos.clear(); recargarSala(); break;
    case 'sesion_cerrada': aviso('La sesión de estudio terminó'); cerrarControl(false); recargarSala(); break;
    case 'zona_friccion': {
      const z = R.datos.friccion || [], i = z.findIndex(x => x.ventanaInicio === p.ventanaInicio);
      const antes = i >= 0 && z[i].esZona;
      if (i >= 0) z[i] = p; else z.push(p);
      R.datos.friccion = z.sort((a, b) => a.ventanaInicio - b.ventanaInicio);
      if (p.esZona && !antes) aviso(`Zona de fricción entre ${mmss(p.ventanaInicio)} y ${mmss(p.ventanaFin)}`);
      pintarLinea(); pintarLado(); break;
    }
    case 'voto_registrado': case 'voto_cambiado': case 'control_revelado': case 'control_cerrado':
      if (R.control?.id === p.checkpointId) refrescarControl();
      if (evento === 'control_revelado' || evento === 'control_cerrado') recargarSala();
      break;
    case 'checkpoints_actualizados': recargarSala(); break;
    case 'chat_mensaje': chatRecibir(p); break;
    case 'invitacion_enviada': recargarSala(); break;
    case 'nb_bloque': if (p.de !== yo.id) nbRecibir(p.bloque); break;
    case 'nb_borrado': if (p.de !== yo.id) nbQuitar(p.id, false); break;
  }
}

/* ---------- Pintado periódico: presencia, sincronía, voz ---------- */
function pintarDinamico() {
  if (!R || !$('#rep')) return;
  const lista = [...R.presencia.values()];
  const sinc = calcularSincronia(lista.map(p => ({ userId: p.userId, posicion: p.posicion })));
  R.sinc = sinc;
  // Avatares arriba del video
  poner($('#presentes'), lista.map(p => {
    const s = sinc.integrantes.find(x => x.userId === p.userId);
    return avatar(p, (R.voz.oradores.includes(p.userId) ? 'habla ' : '') + (s?.desfasado ? 'desfasado' : ''));
  }), fantasmasAhora().filter(p => !p.ausente).map(p => {
    const a = avatar(p, 'fantasma' + (R.fant.sonando?.hablando.has(p.userId) ? ' habla' : '')); a.title = `${p.nombre} (fantasma)`; return a;
  }));
  pintarListaFantasmas();
  // Chips de estado
  const chips = [];
  if (sinc.total > 1) chips.push(h('span', { class: 'chip ' + (sinc.sincronizados === sinc.total ? 'ok' : 'aviso') }, h('i', { class: 'led' }), `${sinc.sincronizados}/${sinc.total} sincronizados`));
  if (R.voz.conectada) chips.push(h('span', { class: 'chip ' + (R.voz.oradores.length ? 'voz' : 'ok') }, h('i', { class: 'led' }), R.voz.oradores.length ? 'Voz detectada' : 'Voz activa'));
  poner($('#estadoSala'), chips);
  pintarAvisoDesfase(sinc);
  pintarAmigosLinea();
  pintarIntegrantes();
  nbPintarCoautores();
}
// Reglas 6 a 8: aviso ámbar sobre la persona más atrasada respecto a mí.
function pintarAvisoDesfase(sinc) {
  const caja = $('#avisoDesfase');
  const v = videoEl(); const mia = v ? v.currentTime : 0;
  const atrasado = sinc.integrantes.filter(s => s.userId !== yo.id && s.desfasado && s.diferencia < 0 && mia - s.posicion > UMBRAL_DESFASE_S).sort((a, b) => a.diferencia - b.diferencia)[0];
  if (!atrasado || R.control) { caja.hidden = true; caja.dataset.firma = ''; return; }
  const p = R.presencia.get(atrasado.userId);
  const causa = causaDesfase(p);
  const esperando = R.esperandoA === p.userId;
  caja.hidden = false;
  const firma = `${p.userId}|${mmss(p.posicion)}|${causa}|${esperando}`;
  if (caja.dataset.firma === firma) return;
  caja.dataset.firma = firma;
  poner(caja, avatar(p),
    h('span', { class: 'txt' }, h('b', {}, `Desincronía · ${mmss(p.posicion)}`), `${primerNombre(p.nombre)}${causa ? ' ' + causa : ' va más atrás'}`),
    h('button', { class: 'btn btn-sol btn-chico', onclick: () => esperar(esperando ? null : p.userId) }, esperando ? 'Dejar de esperar' : 'Esperarlo'));
}
// Regla 8: "Esperarlo" pausa solo mi video hasta que me alcance o yo reanude.
function esperar(id) {
  R.esperandoA = id;
  if (id) { R.motivos.add('espera'); aviso(`Esperando a ${primerNombre(integrante(id).nombre)}. Tu video sigue cuando te alcance.`); }
  else R.motivos.delete('espera');

}
function revisarEspera() {
  if (!R?.esperandoA) return;
  const otro = R.presencia.get(R.esperandoA), v = videoEl();
  if (!otro || !v) return;
  if (otro.posicion >= v.currentTime) { aviso(`${primerNombre(otro.nombre)} te alcanzó`); esperar(null); }
}

function nbElegir(i) {
  const m = R.nb.menu; if (!m) return;

// Captura del fotograma actual (480 px, JPEG) como bloque del cuaderno.
function nbCapturar(reemplazarId = null, reemplazar = false) {
  const v = videoEl();
  if (!v || !v.videoWidth) { aviso('El video aún no tiene imagen para capturar', true); return; }
  if (R.sinCaptura) { aviso('Este video no permite capturar fotogramas (CORS del servidor)', true); return; }
  const ancho = Math.min(480, v.videoWidth), alto = Math.round(ancho * v.videoHeight / v.videoWidth);
  const canvas = h('canvas', { width: ancho, height: alto });
  canvas.getContext('2d').drawImage(v, 0, 0, ancho, alto);
  let imagen;
  try { imagen = canvas.toDataURL('image/jpeg', .72); } catch { aviso('Este video no permite capturar fotogramas', true); return; }
  const extra = { imagen, segundo: Math.round(v.currentTime * 10) / 10 };
  if (reemplazar && reemplazarId && R.nb.bloques.has(reemplazarId)) {
    const b = R.nb.bloques.get(reemplazarId);
    Object.assign(b, { tipo: 'fotograma', html: '', ...extra, actualizadoPor: yo.id });
    nbPintar(); nbEmitir(b); nbGuardar(b.id, 0);
  } else nbCrear('fotograma', R.nb.editando, extra);
  aviso(`Fotograma ${mmss(extra.segundo)} pegado en el cuaderno`);
}

/* ---------- Voz con LiveKit (reglas 13 a 16) ---------- */
async function alternarVoz() {
  if (!R) return;
  const v = R.voz;
  if (!v.conectada) return conectarVoz(true);
  v.mic = !v.mic;
  await v.room.localParticipant.setMicrophoneEnabled(v.mic).catch(x => aviso(x.message, true));
  pintarMic();
}
async function conectarVoz(manual = false) {
  const r = R, v = r?.voz; if (!v || v.conectada || v.conectando) return;
  v.conectando = true; pintarMic();
  try {
    const { token, url } = await api('/voz/token', { method: 'POST', body: { codigo: r.codigo } });
    const room = new Room({ adaptiveStream: true, dynacast: true });
    room.on(RoomEvent.TrackSubscribed, (track, _pub, participante) => {
      if (track.kind !== Track.Kind.Audio) return;
      const el = track.attach(); el.dataset.p = participante.identity; $('#audios').append(el);
    });
    room.on(RoomEvent.TrackUnsubscribed, track => track.detach().forEach(el => el.remove()));
    room.on(RoomEvent.ActiveSpeakersChanged, hablantes => { if (R === r) v.oradores = hablantes.map(p => p.identity); });
    room.on(RoomEvent.AudioPlaybackStatusChanged, () => { v.audioBloqueado = !room.canPlaybackAudio; if (R === r) pintarMic(); });
    room.on(RoomEvent.Disconnected, () => { v.conectada = false; v.oradores = []; if (R === r) pintarMic(); });
    await room.connect(url, token);
    if (R !== r) { room.disconnect(); return; }
    v.room = room; v.conectada = true;
    v.audioBloqueado = !room.canPlaybackAudio;
    try { await room.localParticipant.setMicrophoneEnabled(true); v.mic = true; }
    catch { v.mic = false; aviso('Sin permiso de micrófono: escuchas al squad, pero no te oyen', true); }
    if (manual) aviso('Conectado a la voz del squad');
  } catch (x) { if (manual) aviso('No se pudo conectar la voz: ' + x.message, true); }
  finally { v.conectando = false; if (R === r) pintarMic(); }
}
// Cada 250 ms: alimenta la máquina de estados con "alguien habla" y aplica los efectos al video.
function tickVoz() {
  if (!R) return;
  revisarEspera();
  tickFantasmas(250);
  revisarGrabacion();
  pintarMic();
  const ahora = Date.now(), v = videoEl();
  let s = R.voz.estado;
  if (R.voz.conectada) s = reducirVoz(s, { tipo: 'oradores', hablando: R.voz.oradores.length > 0, reproduciendo: !!v && !v.paused, ahora });
  s = reducirVoz(s, { tipo: 'tick', ahora });
  R.voz.estado = s;
  const ef = efectosVoz(s, ahora);
  // Desvanecimiento del volumen hacia el objetivo (pausa suave).
  R.factorVoz += (ef.volumen - R.factorVoz) * .5; if (Math.abs(ef.volumen - R.factorVoz) < .02) R.factorVoz = ef.volumen;
  aplicarVolumen();
  const antes = R.motivos.has('voz');
  if (ef.pausado && !antes && R.factorVoz <= VOLUMEN_HABLANDO + .05) { R.motivos.add('voz'); aplicarReproduccion(); }
  if (!ef.pausado && antes) { R.motivos.delete('voz'); aplicarReproduccion(); }
  $('#rep')?.classList.toggle('atenuado', ef.pausado);
  const ap = $('#autoPausa'); if (ap) ap.textContent = ef.pausado && !R.control ? (s.modo === 'pausa_mantenida' ? '(Pausa mantenida)' : '(Auto-Pausa por Voz)') : '';
  pintarVoz(s, ef);
}
function pintarVoz(s, ef) {
  const capa = $('#vozCapa'); if (!capa) return;
  if (s.modo === 'normal' || R.control) { capa.hidden = true; return; }
  capa.hidden = false;
  const quien = R.voz.oradores[0];
  const p = quien ? integrante(quien) : null;
  const nombre = p ? (quien === yo.id ? 'Tú' : primerNombre(p.nombre)) : null;
  let tarjeta;
  if (s.modo === 'pausa_mantenida') {
    tarjeta = h('div', { class: 'voz-tarjeta' }, h('p', { class: 'et' }, 'Pausa mantenida'), h('h3', {}, 'El video sigue cuando lo reanudes'),
      h('button', { class: 'btn btn-pri btn-chico', onclick: alternarPlay }, 'Reanudar'));
  } else if (s.modo === 'cuenta_regresiva') {
    tarjeta = h('div', { class: 'voz-tarjeta' }, h('p', { class: 'et' }, 'Reanudando'), h('div', { class: 'cuenta', key: ef.cuenta }, String(ef.cuenta)),
      h('button', { class: 'btn btn-sec btn-chico', onclick: () => { R.voz.estado = reducirVoz(R.voz.estado, { tipo: 'mantener_pausa' }); } }, 'Mantener pausa'));
  } else {
    tarjeta = h('div', { class: 'voz-tarjeta' },
      p ? avatar(p, 'habla') : null,
      h('h3', {}, nombre ? `${nombre} en micrófono` : 'Conversando'),
      p ? h('div', { class: 'ondas' }, h('i'), h('i'), h('i'), h('i'), h('i')) : h('p', {}, 'Reanuda tras 3 s de silencio'),
      h('p', {}, 'Video al 15 % · pausa suave · sin grabación ni transcripción'),
      h('button', { class: 'btn btn-sec btn-chico', onclick: () => { R.voz.estado = reducirVoz(R.voz.estado, { tipo: 'mantener_pausa' }); } }, 'Mantener pausa'));
  }
  // Evita reconstruir la tarjeta si no cambió (para no reiniciar animaciones).
  const firma = `${s.modo}|${quien}|${ef.cuenta}`;
  if (capa.dataset.firma !== firma) { capa.dataset.firma = firma; poner(capa, tarjeta); }
}

// La pregunta se pide unos segundos antes de su minuto, para abrirla al instante al llegar.
function precargarPreguntas(t) {
  R.precarga ??= new Map();
  for (const c of R.datos.checkpoints) {
    if (R.vistos.has(c.id) || R.precarga.has(c.id) || c.segundo - t > 25 || c.segundo < t) continue;
    R.precarga.set(c.id, null);
    const r = R;
    api(`/grupo/salas/${r.codigo}/checkpoints/${c.id}/ronda`).then(v => r.precarga.set(c.id, v)).catch(() => r.precarga.delete(c.id));
  }

async function abrirControl(id) {
  R.vistos.add(id);

async function votar(opcion) {

  catch (x) { aviso(x.message, true); }
  finally { c.enviando = null; if (R?.control === c) { pintarControl(); if (!c.vista) refrescarControl(); } }
}

function cerrarControl(reanudar = true) {

const restante = iso => iso ? Math.max(0, Math.ceil((new Date(iso).getTime() - Date.now()) / 1000)) : null;

  if (r === 0 && !pidiendo) { pidiendo = true; await refrescarControl(); pidiendo = false; }

/* ---------- Mi voz en las discusiones (solo si acepté guardarla) ---------- */
// Se graba solo mi propio micrófono mientras hablo (más 1,5 s), y se sube como clip con el
// minuto del video. Quien vea la clase después escucha esos clips juntos, en el mismo orden.
function revisarGrabacion() {
  if (!R) return;
  const v = R.voz, hablo = v.conectada && v.mic && v.oradores.includes(yo.id), ahora = Date.now();
  if (!yo.grabarVoz || !v.conectada || !v.mic || typeof MediaRecorder === 'undefined') { if (R.grab) terminarClip(); return; }
  if (hablo) {
    if (!R.grab) empezarClip();
    if (R.grab) R.grab.ultimaVoz = ahora;
  }
  if (R.grab && (ahora - R.grab.ultimaVoz > 1500 || ahora - R.grab.inicioMs > 60000)) terminarClip();
}
function empezarClip() {
  const pista = R.voz.room?.localParticipant.getTrackPublication(Track.Source.Microphone)?.track?.mediaStreamTrack;
  if (!pista) return;
  const tipo = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported(t));
  if (!tipo) return;
  const rec = new MediaRecorder(new MediaStream([pista]), { mimeType: tipo, audioBitsPerSecond: 32000 });
  const g = { rec, partes: [], tipo: tipo.split(';')[0], inicioMs: Date.now(), ultimaVoz: Date.now(), inicio: new Date().toISOString(),
    posicion: R.control ? (R.datos.checkpoints.find(c => c.id === R.control.id)?.segundo ?? videoEl().currentTime) : videoEl().currentTime,
    checkpointId: R.control?.id || null, codigo: R.codigo };
  rec.ondataavailable = e => { if (e.data.size) g.partes.push(e.data); };
  rec.onstop = () => subirClip(g);
  rec.start(1000);
  R.grab = g; pintarMic();
}
function terminarClip(descartar = false) {
  const g = R?.grab; if (!g) return;
  R.grab = null;
  g.duracionMs = Date.now() - g.inicioMs;
  if (descartar) g.descartar = true;
  try { g.rec.stop(); } catch {}
  pintarMic();
}
async function subirClip(g) {
  if (g.descartar || g.duracionMs < 800 || !g.partes.length) return;
  try {
    const r = await api(`/grupo/salas/${g.codigo}/voz/clip`, { method: 'POST', body: { posicion: g.posicion, inicio: g.inicio, duracionMs: Math.min(g.duracionMs, 600000), checkpointId: g.checkpointId, tipo: g.tipo } });
    const { error } = await sb.storage.from(r.bucket).uploadToSignedUrl(r.ruta, r.token, new Blob(g.partes, { type: g.tipo }), { contentType: g.tipo });
    if (error) throw error;
  } catch (x) { console.warn('No se guardó el clip de voz', x); }
}

/* ---------- Fantasmas: ver la clase con quienes ya la vieron ---------- */
async function cargarFantasmas() {
  const r = R; if (!r) return;
  try {
    const { sesiones } = await api(`/clases/${r.datos.video.id}/fantasmas?excluir=${r.datos.sesion?.id || ''}`);
    if (R !== r) return;
    r.fant.sesiones = sesiones;
    if (sesiones.length) elegirFantasma(sesiones[0].sessionId, false);
    else pintarCajaFantasmas();
  } catch (x) { console.warn('Sin fantasmas', x); }
}
const sesionFantasma = () => R?.fant.sesiones.find(s => s.sessionId === R.fant.activa) || null;
function fantasmaPersona(id) {
  for (const s of R?.fant.sesiones || []) { const p = s.participantes.find(x => x.userId === id); if (p) return p; }
  return null;
}
function elegirFantasma(sessionId, avisar = true) {
  const f = R.fant;
  pararDiscusion();
  f.activa = sessionId; f.reloj = 0; f.hechas = new Set(); f.chatVisto = new Set(); f.discusiones = [];
  R.chat = R.chat.filter(m => !m.fantasma); chatPintar();
  const s = sesionFantasma();
  if (s) {
    const t0 = Math.min(...s.participantes.map(p => Date.parse(p.iniciado)));
    f.t0 = t0;
    s.participantes.forEach(p => { p.base = Date.parse(p.iniciado) - t0; });
    f.discusiones = agruparClips(s.clips.filter(c => !c.checkpointId));
    if (avisar) aviso(`Verás la clase con ${listaNombres(s.participantes.map(p => p.nombre))} como fantasmas`);
  }
  pintarCajaFantasmas(); pintarLinea(); nbPintarTabs();
}
// Clips que se solapan (o casi) en el tiempo son una misma discusión.
function agruparClips(clips) {
  const orden = [...clips].sort((a, b) => Date.parse(a.inicio) - Date.parse(b.inicio));
  const grupos = [];
  for (const c of orden) {
    const ini = Date.parse(c.inicio), fin = ini + c.duracionMs, g = grupos.at(-1);
    if (g && ini <= g.fin + 4000) { g.clips.push(c); g.fin = Math.max(g.fin, fin); g.posicion = Math.min(g.posicion, c.posicion); }
    else grupos.push({ id: c.id, inicio: ini, fin, posicion: c.posicion, clips: [c] });
  }
  return grupos.map(g => ({ ...g, duracion: g.fin - g.inicio, personas: [...new Set(g.clips.map(c => c.userId))] }));
}
// Posición de un fantasma con el reloj de la sesión (ms desde que empezó el primero).
function posFantasma(p, reloj) {
  const t = reloj - p.base, m = p.muestras;
  if (t < 0 || !m.length) return null;
  if (t > m.at(-1)[0] + 15000) return { posicion: m.at(-1)[1], estado: 1, termino: true };
  let lo = 0, hi = m.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (m[mid][0] <= t) lo = mid; else hi = mid - 1; }
  const a = m[lo], b = m[lo + 1];
  let posicion = a[1];
  if (b && a[2] === 0 && b[1] >= a[1] && b[1] - a[1] < 5 && b[0] > a[0]) posicion = a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0]);
  return { posicion, estado: a[2], termino: false };
}
// El reloj de los fantasmas corre mientras yo veo la clase (o escucho su discusión).
function tickFantasmas(dt) {
  const f = R?.fant; if (!f?.activa) return;
  const v = videoEl();
  if ((v && !v.paused) || f.sonando) f.reloj += dt;
}
function fantasmasAhora() {
  const s = sesionFantasma(); if (!s) return [];
  return s.participantes.map(p => ({ ...p, ...(posFantasma(p, R.fant.reloj) || { posicion: 0, estado: 1, ausente: true }) }));
}
const ESTADO_FANTASMA = ['viendo', 'en pausa', 'tomando notas', 'hablando'];
function pintarCajaFantasmas() {
  const caja = $('#cajaFantasmas'); if (!caja || !R) return;
  const f = R.fant;
  if (!f.sesiones.length) {
    poner(caja, h('h3', {}, 'Fantasmas'), h('p', { class: 'vacio' }, 'Ninguno de tus amigos ha visto esta clase todavía. Cuando la vean, aparecerán aquí; y tú serás su fantasma si la ven después de ti.'));
    return;
  }
  const s = sesionFantasma();
  const fecha = iso => new Date(iso).toLocaleDateString('es', { day: 'numeric', month: 'short' });
  poner(caja,
    h('div', { class: 'tarjeta-cab' }, h('h3', {}, 'Fantasmas'), s ? h('button', { class: 'btn-txt', onclick: () => { f.activa = null; pararDiscusion(); R.chat = R.chat.filter(m => !m.fantasma); chatPintar(); pintarCajaFantasmas(); pintarLinea(); nbPintarTabs(); } }, 'Ocultar') : null),
    h('p', { class: 'vacio' }, 'Tus amigos que ya vieron esta clase avanzan contigo. Sus mensajes aparecen en su minuto y, donde discutieron, escucharás sus voces.'),
    f.sesiones.map(x => h('button', { class: 'fant-sesion', 'aria-pressed': String(x.sessionId === f.activa), onclick: () => elegirFantasma(x.sessionId) },
      h('span', { class: 'fantasma-chip' }, h('span', { class: 'pila' }, x.participantes.slice(0, 4).map(p => avatar(p, 'chico')))),
      h('span', {}, h('div', { class: 't' }, listaNombres(x.participantes.map(p => p.nombre))),
        h('div', { class: 's' }, [fecha(x.fecha), x.chat.length ? `${x.chat.length} mensaje${x.chat.length === 1 ? '' : 's'}` : null, (n => n ? `${n} ${n === 1 ? 'discusión' : 'discusiones'} con voz` : null)(agruparClips(x.clips.filter(c => !c.checkpointId)).length), x.cuaderno.length ? 'cuaderno' : null].filter(Boolean).join(' · '))))),
    s ? h('ul', { class: 'integrantes', id: 'fantasmasLista' }) : null);
  pintarListaFantasmas();
}
function pintarListaFantasmas() {
  const ul = $('#fantasmasLista'); if (!ul || !R) return;
  poner(ul, fantasmasAhora().map(p => h('li', { class: 'integrante', style: 'opacity:.8' },
    avatar(p, 'fantasma'),
    h('div', {}, h('div', { class: 'nombre' }, p.nombre, h('span', { class: 'tag off' }, 'fantasma')),
      h('div', { class: 'sub' }, p.ausente ? 'Todavía no empieza' : p.termino ? 'Terminó aquí' : ESTADO_FANTASMA[p.estado] || '')),
    h('span', { class: 'pos' }, p.ausente ? '' : mmss(p.posicion)))));
}
// Al pasar por el minuto de algo que hicieron los fantasmas: su mensaje o su discusión.
function revisarFantasmas(desde, hasta) {
  const s = sesionFantasma(); if (!s || R.control || hasta - desde > 2 || hasta < desde) return;
  for (const m of s.chat) if (!R.fant.chatVisto.has(m.id) && m.posicion > desde - .01 && m.posicion <= hasta) { R.fant.chatVisto.add(m.id); chatRecibir(m, true); }
  if (R.fant.sonando) return;
  const d = R.fant.discusiones.find(g => !R.fant.hechas.has(g.id) && g.posicion > desde - .01 && g.posicion <= hasta + .25);
  if (d) reproducirDiscusion(d);
}
// Reproduce los clips de una discusión, cada uno a su tiempo. Mi video espera (como la auto-pausa por voz).
function reproducirDiscusion(g, enControl = false) {
  pararDiscusion();
  const f = R.fant;
  f.hechas.add(g.id);
  const audios = g.clips.map(c => ({ c, a: new Audio(c.url), desfase: Date.parse(c.inicio) - g.inicio }));
  const son = { g, audios, timers: [], inicio: Date.now(), enControl, hablando: new Set() };
  f.sonando = son;
  if (!enControl) { R.motivos.add('fantasma'); aplicarReproduccion(); }
  for (const x of audios) {
    x.a.volume = Math.max(.2, R.volumen);
    x.a.onplay = () => { son.hablando.add(x.c.userId); pintarDiscusion(); };
    x.a.onended = x.a.onerror = () => { son.hablando.delete(x.c.userId); pintarDiscusion(); };
    son.timers.push(setTimeout(() => x.a.play().catch(() => {}), x.desfase));
  }
  son.timers.push(setTimeout(() => terminarDiscusion(), g.duracion + 900));
  son.timers.push(setInterval(pintarDiscusion, 200));
  pintarDiscusion();
}
function pararDiscusion() {
  const son = R?.fant?.sonando; if (!son) return;
  son.timers.forEach(t => { clearTimeout(t); clearInterval(t); });
  son.audios.forEach(x => { try { x.a.pause(); } catch {} });
  R.fant.sonando = null;
  $('#fantasmaCapa') && ($('#fantasmaCapa').hidden = true);
}
function terminarDiscusion() {
  const son = R?.fant?.sonando; if (!son) return;
  pararDiscusion();
  if (!son.enControl) { R.motivos.delete('fantasma'); aplicarReproduccion(); }
  else if (R.control) { R.control.cierreAuto = Date.now() + 6000; pintarControl(); }
}
function pintarDiscusion() {
  const son = R?.fant.sonando, capa = $('#fantasmaCapa'); if (!capa) return;
  if (!son || son.enControl) { capa.hidden = true; if (son?.enControl) pintarControlFantasma(); return; }
  capa.hidden = false;
  const avance = Math.min(1, (Date.now() - son.inicio) / Math.max(1, son.g.duracion));
  const habla = [...son.hablando][0];
  const firma = `${habla}`;
  if (capa.dataset.firma !== firma || !capa.firstChild) {
    capa.dataset.firma = firma;
    poner(capa, h('div', { class: 'voz-tarjeta' },
      h('p', { class: 'et' }, 'Fantasmas · discusión grabada'),
      h('div', { class: 'pila' }, son.g.personas.map(id => avatar(integrante(id), son.hablando.has(id) ? 'habla' : ''))),
      h('h3', {}, habla ? `${primerNombre(integrante(habla).nombre)} está hablando` : `Lo que discutieron ${listaNombres(son.g.personas.map(id => integrante(id).nombre))}`),
      h('div', { class: 'progreso' }, h('i', { id: 'progDisc' })),
      h('p', {}, `Grabado en ${mmss(son.g.posicion)} · tu video sigue al terminar`),
      h('button', { class: 'btn btn-sec btn-chico', onclick: terminarDiscusion }, 'Saltar')));
  }
  const barra = $('#progDisc'); if (barra) barra.style.width = `${avance * 100}%`;
}
// En la tarjeta del punto de control: cómo votaron los fantasmas y su debate grabado.
async function cargarVotosFantasma(c) {
  const s = sesionFantasma(); if (!s || c.fantasmas !== undefined) return;
  c.fantasmas = null;
  try {
    const { rondas } = await api(`/clases/${R.datos.video.id}/fantasmas/votos?checkpoint=${c.id}&sesiones=${s.sessionId}`);
    c.fantasmas = rondas.find(r => r.sessionId === s.sessionId) || { votos: [] };
  } catch { c.fantasmas = { votos: [] }; }
  if (R?.control === c) pintarControl();
}
function bloqueFantasmaControl(c, v) {
  const s = sesionFantasma(); if (!s || v.fase !== 'cerrada') return null;
  if (c.fantasmas === undefined) { cargarVotosFantasma(c); return null; }
  const debate = agruparClips(s.clips.filter(x => x.checkpointId === c.id))[0];
  const votos = c.fantasmas?.votos || [];
  if (!votos.length && !debate) return null;
  const son = R.fant.sonando;
  return h('div', { class: 'votos-fantasma', id: 'votosFantasma' },
    h('b', {}, `Así respondieron ${listaNombres(s.participantes.map(p => p.nombre))}`),
    votos.map(x => h('div', { class: 'fila-v' }, avatar(integrante(x.userId), 'chico fantasma'),
      h('span', {}, `${primerNombre(integrante(x.userId).nombre)}: `, h('b', {}, LETRAS[x.inicial]), x.final !== x.inicial ? [' → ', h('b', {}, LETRAS[x.final])] : null, x.final === v.correcta ? ' · acertó' : ' · no acertó'))),
    debate ? h('button', { class: 'btn btn-sec btn-chico', style: 'justify-self:start', onclick: () => {
      if (son?.enControl) { terminarDiscusion(); return; }
      c.cierreAuto = null; reproducirDiscusion(debate, true); pintarControl();
    } }, son?.enControl ? 'Detener' : `Escuchar su debate (${mmss(debate.duracion / 1000)})`) : null);
}
function pintarControlFantasma() {
  const b = $('#votosFantasma button'); const son = R?.fant.sonando;
  if (b && son?.enControl) b.textContent = son.hablando.size ? `Detener · habla ${primerNombre(integrante([...son.hablando][0]).nombre)}` : 'Detener';
}

/* ============ Arranque ============ */
async function arrancar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return irAlLogin();
  await cargarYo(data.session.user);
  usuarioActual().catch(() => {}); // refresca la copia que usan inicio.html y el módulo social
  conectarUsuario();
  const q = new URLSearchParams(location.search);
  if (q.get('sala')) return entrarASala(q.get('sala').toUpperCase());
  if (q.get('clase')) return abrirClase(q.get('clase')).catch(x => pantallaInicio(x.message));
  pantallaInicio();
}
window.addEventListener('beforeunload', () => { if (R) { enviarRecorrido(true); terminarClip(true); } R?.voz.room?.disconnect(); });
try {
  await configurar();
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { yo = null; } });
  await arrancar();
} catch (x) {
  poner($('#vista'), h('section', { class: 'entrada' }, introSala(), h('div', { class: 'form' }, h('h2', {}, 'No se pudo iniciar'), h('p', { class: 'nota' }, x.message))));
}
